name: GitHub Labels

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR number to replay
        required: true
        type: string

permissions: {}

# Do not cancel merged processing when another event arrives for the same PR.
concurrency:
  group: github-labels-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  label-paths:
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No checkout: the action reads labeler.yml from the trusted base branch.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}

  inherit-issue-labels:
    needs: label-paths
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Always execute default-branch code, never a contributor's PR branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - name: Add Classification Labels to Closing Issues
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL_REPO: ${{ github.repository }}
          LABEL_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: bun run scripts/github-labels/main.ts --repo "$LABEL_REPO" --pr "$LABEL_PR" --run
