  publish-bash:
    needs:
      - changes
      - test
    # vars.PUBLISH_BASH turns publishing on once npm trusts this workflow.
    if: vars.PUBLISH_BASH == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.changes.outputs.ts_bash == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm exchanges this OIDC token for a short-lived publish credential.
      id-token: write
    concurrency:
      group: publish-bash
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ts-pkg/bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      # Trusted publishing needs Node 22.14+ and npm 11.5.1+ (npm 12.2.0 below).
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check whether this version is already on npm
        id: version
        run: |
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          python3 "$GITHUB_WORKSPACE/scripts/python/registry_release.py" \
            check npm "$name" "$version"
      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - name: Lint the package
        if: steps.version.outputs.publish == 'true'
        run: bunx publint
      # bun publish has no OIDC support, so pack with Bun and publish the
      # tarball with npm, which handles the trusted-publishing exchange.
      - name: Pack
        if: steps.version.outputs.publish == 'true'
        run: bun pm pack
      # A publish that fails because an earlier run already published this
      # version passes; registry_release.py asks the registry to decide.
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/python/registry_release.py" \
            publish npm "$NAME" "$VERSION" -- \
            npx --yes npm@12.2.0 publish "./uniquedivine-bash-${VERSION}.tgz" --access public
