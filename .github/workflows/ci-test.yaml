        working-directory: mcp/telegram
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: "3.13"
      # Build first: the check compares these filenames with PyPI's, so a
      # version with only some of its files uploaded still publishes.
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Check whether this version is already on PyPI
        id: version
        run: |
          read -r name version < <(uv run --no-project python -c 'import tomllib; p = tomllib.load(open("pyproject.toml", "rb"))["project"]; print(p["name"], p["version"])')
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          uv run --no-project python \
            "$GITHUB_WORKSPACE/scripts/python/registry_release.py" \
            check --dist-dir dist pypi "$name" "$version"
