  publish-telegram-mcp:
    needs:
      - changes
      - telegram
      - python-typecheck
    # vars.PUBLISH_TELEGRAM_MCP turns publishing on once PyPI trusts this workflow.
    if: vars.PUBLISH_TELEGRAM_MCP == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.changes.outputs.telegram == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PyPI exchanges this OIDC token for a short-lived upload token.
      id-token: write
    concurrency:
      group: publish-telegram-mcp
      cancel-in-progress: false
    defaults:
      run:
        working-directory: mcp/telegram
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: "3.13"
      # Build first: the check compares these filenames with PyPI's, so a
      # version with only some of its files uploaded still publishes.
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Check whether this version is already on PyPI
        id: version
        run: |
          read -r name version < <(uv run --no-project python -c 'import tomllib; p = tomllib.load(open("pyproject.toml", "rb"))["project"]; print(p["name"], p["version"])')
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          uv run --no-project python \
            "$GITHUB_WORKSPACE/scripts/python/registry_release.py" \
            check --dist-dir dist pypi "$name" "$version"
      # A rebuilt file rarely matches an uploaded one byte for byte, so
      # registry_release.py first deletes local files PyPI already lists and
      # uploads the rest. uv expands the quoted glob after that. If the upload
      # fails, the step passes only when PyPI lists every built file.
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run --no-project python \
            "$GITHUB_WORKSPACE/scripts/python/registry_release.py" \
            publish --dist-dir dist pypi "$NAME" "$VERSION" -- \
            uv publish --trusted-publishing always \
            --check-url https://pypi.org/simple/ 'dist/*'
