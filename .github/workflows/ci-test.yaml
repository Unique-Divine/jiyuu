# Shared monorepo checks. Keep jobs present and gate their steps with changes outputs.
name: ⚡Tests
"on":
  pull_request: null
  workflow_dispatch: null
  push:
    branches:
      - main
      - release/*
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: ${{ ! (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.typescript == 'true' }}
      tg_sai: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.tg_sai == 'true' }}
      ts_jiyuu: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.ts_jiyuu == 'true' }}
      ts_bash: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.ts_bash == 'true' }}
      mdtoc: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.mdtoc == 'true' }}
      tmux_watch: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.tmux_watch == 'true' }}
      gh_rev: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.gh_rev == 'true' }}
      jiyuu_abi: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.jiyuu_abi == 'true' }}
      evolve_sqlite: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.evolve_sqlite == 'true' }}
      discord: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.discord == 'true' }}
      slack: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.slack == 'true' }}
      telegram: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.telegram == 'true' }}
      python_mcp: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.python_mcp == 'true' }}
      python_tg: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.python_tg == 'true' }}
      mcp_manifest: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.mcp_manifest == 'true' }}
      mori: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.mori == 'true' }}
      jiyuu_mori: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.jiyuu_mori == 'true' }}
      mori_linked: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.mori_linked == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Detect changed projects
        id: paths
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6
        with:
          filters: |
            typescript:
            - mdtoc/**
            - discord-nibiru/**
            - ts-pkg/bash/**
            - ts-pkg/jiyuu/**
            - ts-pkg/tg-sai/**
            - scripts/github-labels/**
            - mcp/scripts/**
            - mori/scripts/**
            - mori/grammars.lock.json
            - package.json
            - bun.lock
            - bun.lockb
            - tsconfig.json
            - bunfig.toml
            - .github/workflows/ci-test.yaml
            - justfile
            tg_sai:
            - ts-pkg/tg-sai/**
            - package.json
            - bun.lock
            - bun.lockb
            - tsconfig.json
            - bunfig.toml
            - .github/workflows/ci-test.yaml
            - justfile
            ts_jiyuu:
            - ts-pkg/jiyuu/**
            - .github/workflows/ci-test.yaml
            ts_bash:
            - ts-pkg/bash/**
            - .github/workflows/ci-test.yaml
            mdtoc:
            - mdtoc/**
            - package.json
            - bun.lock
            - bun.lockb
            - tsconfig.json
            - bunfig.toml
            - .github/workflows/ci-test.yaml
            - justfile
            tmux_watch:
            - tmux-agent-watch/**
            - Cargo.toml
            - Cargo.lock
            - .cargo/**
            - .github/workflows/ci-test.yaml
            - justfile
            evolve_sqlite:
            - evolve-sqlite/**
            - Cargo.toml
            - Cargo.lock
            - .cargo/**
            - .github/workflows/ci-test.yaml
            jiyuu_abi:
            - jiyuu-abi/**
            - Cargo.toml
            - Cargo.lock
            - .cargo/**
            - .github/workflows/ci-test.yaml
            gh_rev:
            - gh-rev/**
            - Cargo.toml
            - Cargo.lock
            - .cargo/**
            - .github/workflows/ci-test.yaml
            - justfile
            discord:
            - mcp/discord/**
            - .github/workflows/ci-test.yaml
            - justfile
            slack:
            - mcp/slack/**
            - .github/workflows/ci-test.yaml
            - justfile
            telegram:
            - mcp/telegram/**
            - .github/workflows/ci-test.yaml
            - justfile
            python_mcp:
            - mcp/telegram/**
            - scripts/python/**
            - .github/workflows/ci-test.yaml
            - justfile
            python_tg:
            - ts-pkg/tg-sai/**
            - scripts/python/**
            - .github/workflows/ci-test.yaml
            - justfile
            mcp_manifest:
            - mcp/**
            - .github/workflows/ci-test.yaml
            - justfile
            mori:
            - mori/**
            - .github/workflows/ci-test.yaml
            - justfile
            jiyuu_mori:
            - mori/jiyuu-mori/**
            - mori/src/**/*.rs
            - mori/internal/cbm/**/*.rs
            - Cargo.toml
            - Cargo.lock
            - .cargo/**
            - .github/workflows/ci-test.yaml
            - justfile
            mori_linked:
            - mori/**
            - Cargo.toml
            - Cargo.lock
            - .cargo/**
            - .github/workflows/ci-test.yaml
            - justfile
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Unaffected project
        if: needs.changes.outputs.typescript != 'true'
        run: echo "No relevant changes; check completed successfully."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.changes.outputs.typescript == 'true'
        with:
          persist-credentials: false
      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
        if: needs.changes.outputs.typescript == 'true'
      - name: Install TypeScript project dependencies
        run: |
          for project in . mdtoc discord-nibiru ts-pkg/bash ts-pkg/jiyuu ts-pkg/tg-sai; do
            (cd "$project" && bun install --frozen-lockfile)
          done
        if: needs.changes.outputs.typescript == 'true'
      - name: Typecheck TypeScript projects
        run: bun check
        if: needs.changes.outputs.typescript == 'true'
      - name: Test Mori grammar scripts
        working-directory: mori
        run: bun test scripts
        if: needs.changes.outputs.typescript == 'true'
      - name: Test tg-sai
        working-directory: ts-pkg/tg-sai
        run: |
          home="$(mktemp -d)"
          env -i PATH="$PATH" HOME="$home" TMPDIR="$RUNNER_TEMP" bun test
        if: needs.changes.outputs.tg_sai == 'true'
    needs: changes
  mdtoc-test:
    runs-on: ubuntu-latest
    steps:
      - name: Unaffected project
        if: needs.changes.outputs.mdtoc != 'true'
        run: echo "No relevant changes; check completed successfully."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.changes.outputs.mdtoc == 'true'
        with:
          persist-credentials: false
      - if: needs.changes.outputs.mdtoc == 'true'
        name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - if: needs.changes.outputs.mdtoc == 'true'
        run: |
          bun install
        working-directory: mdtoc
      - if: needs.changes.outputs.mdtoc == 'true'
        run: |
          bun test
        working-directory: mdtoc
    needs: changes
  tmux-agent-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Unaffected project
        if: needs.changes.outputs.tmux_watch != 'true'
        run: echo "No relevant changes; check completed successfully."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.changes.outputs.tmux_watch == 'true'
        with:
          persist-credentials: false
      - if: needs.changes.outputs.tmux_watch == 'true'
        name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - if: needs.changes.outputs.tmux_watch == 'true'
        name: Install just
        uses: extractions/setup-just@v3
      - if: needs.changes.outputs.tmux_watch == 'true'
        name: Install tmux
        run: sudo apt-get install --yes --no-install-recommends tmux
      - if: needs.changes.outputs.tmux_watch == 'true'
        name: Lint
        run: just --justfile tmux-agent-watch/justfile lint
      - if: needs.changes.outputs.tmux_watch == 'true'
        name: Test
        run: just --justfile tmux-agent-watch/justfile test
    needs: changes
  evolve-sqlite:
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.evolve_sqlite != 'true'
        run: echo "No relevant changes; check completed successfully."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.changes.outputs.evolve_sqlite == 'true'
        with:
          persist-credentials: false
      - if: needs.changes.outputs.evolve_sqlite == 'true'
        name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: extractions/setup-just@v3
        if: needs.changes.outputs.evolve_sqlite == 'true'
      - if: needs.changes.outputs.evolve_sqlite == 'true'
        run: just --justfile evolve-sqlite/justfile check
    needs: changes
  jiyuu-abi:
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.jiyuu_abi != 'true'
        run: echo "No relevant changes; check completed successfully."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.changes.outputs.jiyuu_abi == 'true'
        with:
          persist-credentials: false
      - if: needs.changes.outputs.jiyuu_abi == 'true'
        name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: extractions/setup-just@v3
        if: needs.changes.outputs.jiyuu_abi == 'true'
      - if: needs.changes.outputs.jiyuu_abi == 'true'
        run: just --justfile jiyuu-abi/justfile check
    needs: changes
  gh-rev:
    runs-on: ubuntu-latest
    steps:
      - name: Unaffected project
        if: needs.changes.outputs.gh_rev != 'true'
        run: echo "No relevant changes; check completed successfully."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.changes.outputs.gh_rev == 'true'
        with:
          persist-credentials: false
      - if: needs.changes.outputs.gh_rev == 'true'
        name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - if: needs.changes.outputs.gh_rev == 'true'
        name: Install just
        uses: extractions/setup-just@v3
      - if: needs.changes.outputs.gh_rev == 'true'
        name: Check
        run: just --justfile gh-rev/justfile check
    needs: changes
  discord:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/discord
    steps:
      - name: Unaffected project
        if: needs.changes.outputs.discord != 'true'
        run: echo "No relevant changes; check completed successfully."
        working-directory: ${{ runner.temp }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.changes.outputs.discord == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
        if: needs.changes.outputs.discord == 'true'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
        if: needs.changes.outputs.discord == 'true'
      - name: Run bun:test suite
        run: bun test --isolate ./src
        if: needs.changes.outputs.discord == 'true'
      - name: Typecheck
        run: bun check
        if: needs.changes.outputs.discord == 'true'
      - name: Check entrypoint imports
        run:
          bun build --target bun --packages external ./src/index.ts ./src/app.ts
          --outdir ./node_modules/.cache/mcp-check
        if: needs.changes.outputs.discord == 'true'
    needs: changes
  slack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/slack
    steps:
      - name: Unaffected project
        if: needs.changes.outputs.slack != 'true'
        run: echo "No relevant changes; check completed successfully."
        working-directory: ${{ runner.temp }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.changes.outputs.slack == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
        if: needs.changes.outputs.slack == 'true'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
        if: needs.changes.outputs.slack == 'true'
      - name: Run bun:test suite
        run: bun test ./test
        if: needs.changes.outputs.slack == 'true'
      - name: Check entrypoint imports
        run:
          bun build --target bun --packages external ./src/cli.js ./src/server.js ./src/server-http.js ./src/web-server.js
          --outdir ./node_modules/.cache/mcp-check
        if: needs.changes.outputs.slack == 'true'
    needs: changes
  telegram:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/telegram
    steps:
      - name: Unaffected project
        if: needs.changes.outputs.telegram != 'true'
        run: echo "No relevant changes; check completed successfully."
        working-directory: ${{ runner.temp }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.changes.outputs.telegram == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        if: needs.changes.outputs.telegram == 'true'
      - name: Install locked environment
        run: uv sync --frozen --group dev
        if: needs.changes.outputs.telegram == 'true'
      - name: Test
        run: uv run --frozen pytest -q
        if: needs.changes.outputs.telegram == 'true'
      - name: Check formatting
        run: uv run --frozen black --check main.py sanitize.py session_string_generator.py telegram_mcp tests
        if: needs.changes.outputs.telegram == 'true'
      # uvx installs the published wheel without uv.lock, resolving the newest
      # versions the dependency ranges allow. Build and install the same way,
      # so a range that admits a breaking release fails here, not for users.
      - name: Install the built wheel without the lockfile and import it
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/telegram-wheel"
          uv venv "$RUNNER_TEMP/telegram-fresh"
          uv pip install --python "$RUNNER_TEMP/telegram-fresh/bin/python" "$RUNNER_TEMP"/telegram-wheel/*.whl
          # -I and a neutral working directory keep the checkout off sys.path,
          # so this imports only what the wheel installed. Importing
          # telegram_mcp.runtime needs real Telegram config, so check the SDK
          # API it uses and that every shipped module is present instead.
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/telegram-fresh/bin/python" -I -c 'import importlib.util as u, mcp.server.fastmcp, telethon, telegram_mcp; mods = ["main", "sanitize", "session_string_generator", "telegram_mcp.runtime", "telegram_mcp.tools", "telegram_mcp.update_check"]; missing = [m for m in mods if u.find_spec(m) is None]; assert not missing, missing; print("wheel ok")'
        if: needs.changes.outputs.telegram == 'true'
    needs: changes
  # Site manifests feed the MCP pages on uniquedivine.com. Listing Telegram's
  # tools imports the package, so this job needs its locked uv environment.
  mcp-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Unaffected project
        if: needs.changes.outputs.mcp_manifest != 'true'
        run: echo "No relevant changes; check completed successfully."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.changes.outputs.mcp_manifest == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
        if: needs.changes.outputs.mcp_manifest == 'true'
      - uses: astral-sh/setup-uv@v6
        if: needs.changes.outputs.mcp_manifest == 'true'
      - name: Install Telegram's locked environment
        run: uv sync --frozen
        working-directory: mcp/telegram
        if: needs.changes.outputs.mcp_manifest == 'true'
      - name: Test the generator
        run: bun test mcp/scripts
        if: needs.changes.outputs.mcp_manifest == 'true'
      - name: Check committed site manifests
        run: bun --no-env-file run mcp/scripts/site-manifest.ts --check
        if: needs.changes.outputs.mcp_manifest == 'true'
    needs: changes
  python-typecheck:
    name: Python types / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Telegram MCP
            path: mcp/telegram
            artifact: telegram-mcp
            report_recipe: typecheck-report
            filter: python_mcp
          - name: tg-sai Python
            path: ts-pkg/tg-sai
            artifact: tg-sai-python
            report_recipe: py-typecheck-report
            filter: python_tg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
        if: needs.changes.outputs[matrix.filter] == 'true'
      - name: Unaffected project
        if: needs.changes.outputs[matrix.filter] != 'true'
        run: echo "No relevant Python project changes; check completed successfully."
      - name: Set up uv and managed Python
        if: needs.changes.outputs[matrix.filter] == 'true'
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: "3.13"
      - name: Set up Just
        if: needs.changes.outputs[matrix.filter] == 'true'
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Install locked project environment
        if: needs.changes.outputs[matrix.filter] == 'true'
        working-directory: ${{ matrix.path }}
        run: uv sync --frozen --group dev
      - name: Verify enforcement, reporting, and file discovery
        if: needs.changes.outputs[matrix.filter] == 'true'
        working-directory: ${{ matrix.path }}
        run: uv run --frozen --no-sync python -m unittest discover -s "$GITHUB_WORKSPACE/scripts/python" -p 'test_*.py' -v
      - name: Enforce and report type diagnostics
        id: report
        if: needs.changes.outputs[matrix.filter] == 'true'
        working-directory: ${{ matrix.path }}
        env:
          REPORT_RECIPE: ${{ matrix.report_recipe }}
          REPORT_NAME: ${{ matrix.artifact }}
        run: just "$REPORT_RECIPE" "$RUNNER_TEMP/python-types/$REPORT_NAME" enforce
      - name: Upload native diagnostics and report
        if: always() && steps.report.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-types-${{ matrix.artifact }}
          path: ${{ runner.temp }}/python-types/${{ matrix.artifact }}
          if-no-files-found: error
    needs: changes
  # Candidate Mori grammar and extraction suites. The compiler cache carries
  # compiled objects between runs. These suites link ASan test objects beyond
  # upstream's cbm-third-party target. scripts/env.sh puts ccache in front of
  # gcc with CCACHE_COMPILERCHECK=content.
  mori-c:
    name: Mori C / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CCACHE_MAXSIZE: 1G
      MORI_CANDIDATE_SUITES: >-
        edge_types_probe lang_contract cross_repo extraction graph_buffer pipeline yaml language
        config_text_edit doclinks doc_links_pdf watcher daemon_ipc
        store_graph_digest pipeline_frozen httpd
    steps:
      - name: Unaffected project
        if: needs.changes.outputs.mori != 'true'
        run: echo "No relevant changes; check completed successfully."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.changes.outputs.mori == 'true'
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install build dependencies
        if: needs.changes.outputs.mori == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ccache jq zlib1g-dev zstd
      - name: Install bun
        if: needs.changes.outputs.mori == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install Rust for native GraphQL fixtures
        if: needs.changes.outputs.mori == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Install just
        if: needs.changes.outputs.mori == 'true'
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Compute cache keys
        id: keys
        if: needs.changes.outputs.mori == 'true'
        run: |
          echo "grammars=$(jq -r .sha256 mori/grammars.lock.json)" >> "$GITHUB_OUTPUT"
          echo "cc=$(gcc -dumpmachine)-gcc$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - name: Restore grammar archive
        if: needs.changes.outputs.mori == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/jiyuu-mori/grammars
          key: mori-grammars-${{ steps.keys.outputs.grammars }}
      # Job jiyuu-mori-linked falls back to this key format
      # (mori-ccache-<cc>-<grammars>-<Makefile hash>); change both together.
      - name: Restore compiler cache
        if: needs.changes.outputs.mori == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: mori-ccache-${{ steps.keys.outputs.cc }}-${{ steps.keys.outputs.grammars }}-${{ hashFiles('mori/Makefile.cbm') }}
          restore-keys: |
            mori-ccache-${{ steps.keys.outputs.cc }}-${{ steps.keys.outputs.grammars }}-
            mori-ccache-${{ steps.keys.outputs.cc }}-
      - name: Fetch grammars
        if: needs.changes.outputs.mori == 'true'
        run: just --justfile mori/justfile grammars
      - name: Reset compiler cache statistics
        if: needs.changes.outputs.mori == 'true'
        run: ccache --zero-stats
      - name: Check native contracts and the parity harness
        if: needs.changes.outputs.mori == 'true'
        working-directory: mori
        run: |
          bash tests/test_language_count_contract.sh
          scripts/security-vendored.sh
          just parity-test
      - name: Run candidate grammar and extraction suites
        id: mori-native-baseline
        if: needs.changes.outputs.mori == 'true'
        working-directory: mori
        run: |
          set -o pipefail
          scripts/test.sh --suites "$MORI_CANDIDATE_SUITES" 2>&1 | tee "$RUNNER_TEMP/mori-native-baseline.log"
      - name: Report shadow native suite selection
        if: >-
          always() && (steps.mori-native-baseline.outcome == 'success' ||
          steps.mori-native-baseline.outcome == 'failure')
        continue-on-error: true
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MORI_ARCH: ${{ matrix.arch }}
          BASELINE_OUTCOME: ${{ steps.mori-native-baseline.outcome }}
        run: >-
          python3 mori/scripts/ci/mori_ci_shadow.py
          --base "$PR_BASE" --head "$PR_HEAD" --tested "$GITHUB_SHA"
          --arch "$MORI_ARCH" --outcome "$BASELINE_OUTCOME"
          --baseline-suites "$MORI_CANDIDATE_SUITES"
          --log "$RUNNER_TEMP/mori-native-baseline.log"
      - name: Run Rust, JVM, and C# documentation-link suites
        if: needs.changes.outputs.mori == 'true'
        working-directory: mori
        run: scripts/test.sh --suites "doc_mentions_rs doc_mentions_jvm doc_mentions"
      # Mori PRs run the same gate against the linked candidate below.
      - name: Smoke-test the candidate standalone executable
        id: standalone-smoke
        if: github.event_name != 'pull_request' && needs.changes.outputs.mori == 'true'
        working-directory: mori
        run: |
          set -euo pipefail
          scripts/build.sh BUILD_DIR=build/candidate-standalone
          scripts/smoke-built-binary.sh "$PWD/build/candidate-standalone/codebase-memory-mcp"
      - name: Report standalone smoke result
        if: always() && github.event_name != 'pull_request' && needs.changes.outputs.mori == 'true'
        env:
          ARCH: ${{ matrix.arch }}
          SMOKE_RESULT: ${{ steps.standalone-smoke.outcome }}
        run: |
          printf 'Standalone smoke for %s (fixture index, Rust FTS symbol, no test hooks): **%s**\n' \
            "$ARCH" "$SMOKE_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify native fixtures exercised Rust GraphQL callbacks
        if: needs.changes.outputs.mori == 'true'
        run: just --justfile mori/justfile test-graphql-rust build/c
      - name: Compiler cache statistics
        if: always() && needs.changes.outputs.mori == 'true'
        run: ccache --show-stats || true
    needs: changes
  # Pure-Rust checks for crate jiyuu-mori: no C toolchain, no grammars.
  jiyuu-mori:
    runs-on: ubuntu-latest
    steps:
      - name: Unaffected project
        if: needs.changes.outputs.jiyuu_mori != 'true'
        run: echo "No relevant changes; check completed successfully."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.changes.outputs.jiyuu_mori == 'true'
        with:
          persist-credentials: false
      - name: Install Rust
        if: needs.changes.outputs.jiyuu_mori == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Install just
        if: needs.changes.outputs.jiyuu_mori == 'true'
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Check
        if: needs.changes.outputs.jiyuu_mori == 'true'
        run: just --justfile mori/jiyuu-mori/justfile check
    needs: changes
  # The linked candidate is tested against the pinned C executable. This job
  # shares the grammar archive cache with mori-c and falls back to its compiler
  # cache.
  jiyuu-mori-linked:
    name: jiyuu-mori linked / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            reference_sha256: ba3cbc562e6c41585144e78857a54a51badae99bdb5e6050cedc79089817ed07
          - arch: arm64
            runner: ubuntu-24.04-arm
            reference_sha256: a4984606e39dcdf6e5d4a86f31ceea4d0f49761fe4dc3eb91544cdc86e26e1bb
    env:
      CCACHE_MAXSIZE: 1G
      # As mori/scripts/env.sh sets it: a hit is the identical compilation.
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Unaffected project
        if: needs.changes.outputs.mori_linked != 'true'
        run: echo "No relevant changes; check completed successfully."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.changes.outputs.mori_linked == 'true'
        with:
          persist-credentials: false
      - name: Install build dependencies
        if: needs.changes.outputs.mori_linked == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ccache jq zlib1g-dev zstd
      # build.rs runs make without scripts/env.sh, so put ccache's
      # masquerade directory first on PATH the way env.sh does.
      - name: Route gcc through ccache
        if: needs.changes.outputs.mori_linked == 'true'
        run: echo /usr/lib/ccache >> "$GITHUB_PATH"
      - name: Install bun
        if: needs.changes.outputs.mori_linked == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install Rust
        if: needs.changes.outputs.mori_linked == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - name: Install just
        if: needs.changes.outputs.mori_linked == 'true'
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Compute cache keys
        id: keys
        if: needs.changes.outputs.mori_linked == 'true'
        run: |
          echo "grammars=$(jq -r .sha256 mori/grammars.lock.json)" >> "$GITHUB_OUTPUT"
          echo "cc=$(gcc -dumpmachine)-gcc$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - name: Restore grammar archive
        if: needs.changes.outputs.mori_linked == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/jiyuu-mori/grammars
          key: mori-grammars-${{ steps.keys.outputs.grammars }}
      # Same key family as mori-c plus a -rs suffix: each job saves its own
      # entry, and either one's restore-keys prefix can pick up the other's.
      - name: Restore compiler cache
        if: needs.changes.outputs.mori_linked == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: mori-ccache-${{ steps.keys.outputs.cc }}-${{ steps.keys.outputs.grammars }}-${{ hashFiles('mori/Makefile.cbm') }}-rs
          restore-keys: |
            mori-ccache-${{ steps.keys.outputs.cc }}-${{ steps.keys.outputs.grammars }}-${{ hashFiles('mori/Makefile.cbm') }}
            mori-ccache-${{ steps.keys.outputs.cc }}-${{ steps.keys.outputs.grammars }}-
            mori-ccache-${{ steps.keys.outputs.cc }}-
      - name: Fetch grammars
        if: needs.changes.outputs.mori_linked == 'true'
        run: just --justfile mori/justfile grammars
      - name: Reset compiler cache statistics
        if: needs.changes.outputs.mori_linked == 'true'
        run: ccache --zero-stats
      - name: Identify the frozen C test reference
        if: needs.changes.outputs.mori_linked == 'true'
        id: c-oracle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          key="$(python3 mori/scripts/c_reference_cache.py key "linux-$ARCH")"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
      - name: Cache the frozen C test reference
        if: needs.changes.outputs.mori_linked == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mori-test-c-reference
          key: mori-c-reference-${{ steps.c-oracle.outputs.key }}
      - name: Verify or build the frozen C test reference
        if: needs.changes.outputs.mori_linked == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/mori-test-c-reference"
          python3 mori/scripts/c_reference_cache.py ensure "linux-$ARCH" "$reference"
          printf 'MORI_C_REFERENCE_BIN=%s/codebase-memory-mcp\n' "$reference" >> "$GITHUB_ENV"
      - name: Check linked
        if: needs.changes.outputs.mori_linked == 'true'
        run: just --justfile mori/jiyuu-mori/justfile check-linked
      - name: Verify replay harness against the pinned C reference
        if: needs.changes.outputs.mori_linked == 'true'
        working-directory: mori
        run: |
          set -euo pipefail
          args=(--bin-a "$MORI_C_REFERENCE_BIN" --bin-b "$MORI_C_REFERENCE_BIN")
          python3 -I parity/parity.py ci "${args[@]}"
          python3 -I parity/parity.py ci "${args[@]}" --corrupt all
      - name: CLI parity
        if: needs.changes.outputs.mori_linked == 'true'
        run: just --justfile mori/jiyuu-mori/justfile parity
      # The linked job covers every path that previously triggered the Mori
      # PR smoke. Cargo-only changes still report the check without gating.
      - name: Smoke-test the linked candidate
        id: linked-smoke
        if: needs.changes.outputs.mori_linked == 'true'
        continue-on-error: ${{ github.event_name != 'pull_request' || needs.changes.outputs.mori != 'true' }}
        run: mori/scripts/smoke-built-binary.sh "$PWD/target/debug/mori"
      - name: Report linked smoke result
        if: always() && needs.changes.outputs.mori_linked == 'true'
        env:
          ARCH: ${{ matrix.arch }}
          SMOKE_RESULT: ${{ steps.linked-smoke.outcome }}
        run: |
          printf 'Linked smoke for %s (fixture index, Rust FTS symbol, no test hooks): **%s**\n' \
            "$ARCH" "$SMOKE_RESULT" >> "$GITHUB_STEP_SUMMARY"
      # The release reference includes the accepted GraphQL fixture behavior.
      - name: Public graph and tool replay
        if: needs.changes.outputs.mori_linked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          REFERENCE_SHA256: ${{ matrix.reference_sha256 }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d /tmp/mori-pr-replay.XXXXXX)"
          trap 'rm -rf "$scratch"' EXIT
          archive="codebase-memory-mcp-0.13.1-linux-$ARCH.tar.gz"
          gh release download mori/v0.13.1 --repo Unique-Divine/jiyuu \
            --pattern "$archive" --dir "$scratch"
          printf '%s  %s\n' "$REFERENCE_SHA256" "$scratch/$archive" | sha256sum --check
          tar -xzf "$scratch/$archive" -C "$scratch" codebase-memory-mcp
          just mori-parity-ci \
            --bin-a "$scratch/codebase-memory-mcp" --bin-b "$PWD/target/debug/mori" \
            --profile --export-b rust --verify-export \
            --work "$scratch/w" --rt-prefix "$scratch/r"
          grep -E 'msg=pass\.route_nodes\.graphql routes=[1-9][0-9]* .*planner=rust writer=rust' \
            "$scratch"/w/b/cache/logs/.worker-log-*
      - name: Compiler cache statistics
        if: always() && needs.changes.outputs.mori_linked == 'true'
        run: ccache --show-stats || true
    needs: changes
  # Publish jobs, one per distributable package. Each runs only on a push to
  # main after the tests pass, and only when its package changed and npm
  # doesn't have its version yet. Releases use npm trusted publishing (OIDC):
  # the package trusts this workflow file (ci-test.yaml), so no npm token is
  # stored. To add a package: copy this block, register ci-test.yaml as the
  # package's trusted publisher, then set its PUBLISH_* repository variable.
  publish-tg-sai:
    needs:
      - changes
      - test
    # vars.PUBLISH_TG_SAI turns publishing on once npm trusts this workflow.
    if: vars.PUBLISH_TG_SAI == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.changes.outputs.tg_sai == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm exchanges this OIDC token for a short-lived publish credential.
      id-token: write
    concurrency:
      group: publish-tg-sai
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ts-pkg/tg-sai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      # Trusted publishing needs Node 22.14+ and npm 11.5.1+ (npm 12.2.0 below).
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check whether this version is already on npm
        id: version
        run: |
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          python3 "$GITHUB_WORKSPACE/scripts/python/registry_release.py" \
            check npm "$name" "$version"
      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - name: Lint the package
        if: steps.version.outputs.publish == 'true'
        run: bunx publint
      # bun publish has no OIDC support, so pack with Bun and publish the
      # tarball with npm, which handles the trusted-publishing exchange.
      - name: Pack
        if: steps.version.outputs.publish == 'true'
        run: bun pm pack
      # A publish that fails because an earlier run already published this
      # version passes; registry_release.py asks the registry to decide.
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/python/registry_release.py" \
            publish npm "$NAME" "$VERSION" -- \
            npx --yes npm@12.2.0 publish "./uniquedivine-tg-sai-${VERSION}.tgz" --access public
