# Mori release: builds the Rust binary mori (crate mori/jiyuu-mori with the C
# program linked in) for Linux x64 and arm64 and macOS arm64 and x64, checks
# its CLI against the C binary codebase-memory-mcp from the same commit, and
# publishes a DRAFT GitHub release for a mori/v* tag. See mori/README.md
# "Release".
#
# - Tag push mori/vX.Y.Z: the tag must equal mori/VERSION. Builds, packages,
#   attests and creates a draft release that is not marked latest.
# - workflow_dispatch: dry_run (default true) builds and uploads workflow
#   artifacts only. dry_run=false publishes only when run on a mori/v* tag.
name: Mori release

on:
  push:
    tags: ["mori/v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts only; create no release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mori-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    defaults:
      run:
        working-directory: mori
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun test scripts/release.test.ts
      - name: Check the tag against mori/VERSION
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$REF" == refs/tags/mori/v* ]]; then
            version="$(bun scripts/release.ts validate "$REF_NAME")"
            if [[ "$EVENT_NAME" == push || "$DRY_RUN" == false ]]; then
              publish=true
            fi
          else
            if [[ "$DRY_RUN" == false ]]; then
              echo "::error::dry_run=false needs a mori/v* tag ref."
              exit 1
            fi
            version="$(bun scripts/release.ts validate)"
          fi
          {
            echo "version=$version"
            echo "tag=mori/v$version"
            echo "publish=$publish"
            echo "source_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Mori $version, publish=$publish" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: linux-arm64
            goos: linux
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          # Apple silicon. The macOS 14.0 minimum comes from Makefile.cbm
          # (the C objects) and MACOSX_DEPLOYMENT_TARGET (the Rust link), not
          # from this runner's SDK.
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            arch: arm64
            rust_target: aarch64-apple-darwin
            runner: macos-15
          # Intel Macs, built and smoke-tested natively on GitHub's x86_64
          # macOS runner. Same 14.0 minimum as arm64.
          - target: darwin-x64
            goos: darwin
            goarch: amd64
            arch: x86_64
            rust_target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mori
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RUST_TARGET: ${{ matrix.rust_target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      # npm builds the graph UI (mori/graph-ui), which the binary embeds.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}
      - name: Name the binaries
        run: |
          {
            echo "BIN=$RUNNER_TEMP/selected/mori"
            echo "C_BIN=$GITHUB_WORKSPACE/mori/build/mori-rs/codebase-memory-mcp"
          } >> "$GITHUB_ENV"
      - name: Install build dependencies (Linux)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev zstd
      # The macOS SDK ships zlib; the image usually has zstd already.
      - name: Install build dependencies (macOS)
        if: matrix.goos == 'darwin'
        run: command -v zstd || brew install zstd
      - name: Cache grammar archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/jiyuu-mori/grammars
          key: mori-grammars-${{ hashFiles('mori/grammars.lock.json') }}
      - name: Fetch grammars
        run: bun scripts/grammars-fetch.ts
      # cargo's build.rs runs `make -f Makefile.cbm libmori-c` and links the
      # archive whole; MORI_C_REFERENCE=1 also builds codebase-memory-mcp
      # from the same sources for the parity check. MORI_WITH_UI=1 embeds the
      # graph UI in both, as scripts/build.sh --with-ui does. CFLAGS_EXTRA
      # stamps CBM_VERSION into both, as scripts/build.sh --version does.
      # Linux links glibc statically (+crt-static), like the C release's
      # STATIC=1, so one binary runs on any distro. macOS has no static libc:
      # the binary links libSystem, libz and libc++ from the OS.
      - name: Build mori
        env:
          MORI_C_REFERENCE: "1"
          MORI_WITH_UI: "1"
          CC: ${{ matrix.goos == 'linux' && 'gcc' || 'cc' }}
          CXX: ${{ matrix.goos == 'linux' && 'g++' || 'c++' }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          set -euo pipefail
          export CFLAGS_EXTRA="-DCBM_VERSION=\"\\\"$VERSION\\\"\""
          MORI_MAKE_JOBS="$(getconf _NPROCESSORS_ONLN)"
          export MORI_MAKE_JOBS
          if [[ "$RUNNER_OS" == Linux ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --locked --features c-backend \
            --target "$RUST_TARGET" --manifest-path jiyuu-mori/Cargo.toml
          mkdir -p "$(dirname "$BIN")"
          cp "../target/$RUST_TARGET/release/mori" "$BIN.unstripped"
      - name: Strip and check static linking (Linux)
        if: matrix.goos == 'linux'
        run: |
          set -euo pipefail
          strip --strip-all -o "$BIN" "$BIN.unstripped"
          file "$BIN"
          # ldd exits 1 on a static binary, so read its message instead.
          linkage="$(ldd "$BIN" 2>&1 || true)"
          echo "$linkage"
          grep -Eq 'not a dynamic executable|statically linked' <<< "$linkage"
      # Apple's strip rejects --strip-all, and stripping breaks the linker's
      # ad-hoc signature, which arm64 macOS needs to run the binary at all.
      # Re-sign ad hoc, as upstream did. There is no Developer ID signature
      # and no notarization.
      - name: Strip, sign ad hoc and check linking (macOS)
        if: matrix.goos == 'darwin'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cp "$BIN.unstripped" "$BIN"
          strip "$BIN"
          codesign --sign - --force --timestamp=none "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          file "$BIN"
          archs="$(lipo -archs "$BIN")"
          [ "$archs" = "$ARCH" ]
          otool -l "$BIN" | grep -A4 LC_BUILD_VERSION
          load_cmds="$(otool -l "$BIN")"
          printf '%s\n' "$load_cmds" | grep -E 'minos 14\.0$' >/dev/null
          # Only libraries every Mac has: nothing from Homebrew or elsewhere.
          libs="$(otool -L "$BIN" | tail -n +2 | awk '{print $1}')"
          echo "$libs"
          if grep -Ev '^(/usr/lib/|/System/Library/)' <<< "$libs"; then
            echo "::error::links a library outside the OS"
            exit 1
          fi
      - name: Smoke-test version, a tiny index and the graph UI
        run: |
          set -euo pipefail
          got="$("$BIN" --version)"
          if [[ "$got" != "mori $VERSION" ]]; then
            echo "::error::--version printed '$got'"
            exit 1
          fi
          # The runtime dir must exist and stay short: it holds the CLI
          # coordination socket, and macOS caps socket paths at 104 bytes,
          # which its default mktemp dir under /var/folders nearly fills.
          scratch="$(mktemp -d /tmp/mori.XXXXXX)"
          repo="$scratch/repo"
          mkdir -p "$repo" "$scratch/home"
          mkdir -m 700 "$scratch/run"
          printf 'def greet(name):\n    return helper(name)\n\n' \
            > "$repo/app.py"
          printf 'def helper(name):\n    return "hi " + name\n' \
            >> "$repo/app.py"
          export HOME="$scratch/home"
          export CBM_CACHE_DIR="$scratch/cache"
          export CBM_RUNTIME_DIR="$scratch/run"
          "$BIN" cli index_repository --repo-path "$repo" \
            | tee "$scratch/index.json"
          project="$(jq -r .project "$scratch/index.json")"
          test "$(jq -r .status "$scratch/index.json")" = indexed
          "$BIN" cli trace_path --project "$project" --function-name greet \
            --direction outbound | tee "$scratch/trace"
          grep -q '\.app\.helper 1$' "$scratch/trace"
          # The embedded graph UI: a daemon on a free port serves its index.
          port="$(python3 -c 'import socket; s = socket.socket(); \
            s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          "$BIN" daemon start --port="$port"
          trap '"$BIN" daemon stop || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$port/" -o "$scratch/ui.html" \
              2>/dev/null; then
              break
            fi
            sleep 1
          done
          head -c 300 "$scratch/ui.html"; echo
          grep -qi '<!doctype html>' "$scratch/ui.html"
      # The shipped (stripped, signed) mori against the C binary built from
      # the same commit: same commands, same output after normalization.
      - name: CLI parity with codebase-memory-mcp
        run: bun scripts/cli-parity.ts --mori "$BIN" --c "$C_BIN"
      - name: Package archive
        id: package
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          asset="$(bun scripts/release.ts asset-name "$VERSION" "$TARGET")"
          sha="$(shasum -a 256 "$BIN" | cut -d' ' -f1)"
          scripts/package-release.sh "$GOOS" "$GOARCH" \
            --selected-binary "$BIN" --expected-sha256 "$sha" \
            --out-dir "$RUNNER_TEMP/dist" --archive-name "${asset%.tar.gz}" \
            --binary-name mori
          tar -tzvf "$RUNNER_TEMP/dist/$asset"
          # C collation: macOS sort would otherwise put lowercase first.
          members="$(tar -tzf "$RUNNER_TEMP/dist/$asset" | LC_ALL=C sort \
            | tr '\n' ' ')"
          want='LICENSE NOTICE THIRD_PARTY_NOTICES.md mori '
          if [[ "$members" != "$want" ]]; then
            echo "::error::unexpected archive members: $members"
            exit 1
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      # Only the .tar.gz ships. package-release.sh also writes an .mcpb
      # bundle for darwin, which this upload leaves out.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mori-build-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error

  prepare:
    needs: [validate, build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mori
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mori-build-*
          path: release-assets
          merge-multiple: true
      - name: Write checksums and metadata
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          bun scripts/release.ts prepare "$VERSION" ../release-assets \
            --tag "$TAG" --commit "$SOURCE_SHA"
          cat ../release-assets/checksums.txt
          cat ../release-assets/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mori-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_sha }}
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: [validate, prepare]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: mori
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mori-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_sha }}
          path: release-assets
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/checksums.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: bun scripts/release.ts publish "$TAG" ../release-assets --repo "$REPO"
