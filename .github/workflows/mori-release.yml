# Mori package previews, daily checks, and tagged releases share the same
# per-target build and parity workflow.
name: Mori release

on:
  schedule:
    - cron: "23 4 * * *"
  push:
    tags: ["mori/v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts only; create no release
        type: boolean
        default: true
      prewarm_oracle:
        description: Populate the three preview C reference caches on main
        type: boolean
        default: false
      daily_check:
        description: Run the four daily checks on main without filing issues
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mori-release-${{ (github.event_name == 'schedule' || inputs.daily_check) && 'daily' || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    if: github.event_name != 'schedule' || (github.repository == 'Unique-Divine/jiyuu' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      artifact: ${{ steps.plan.outputs.artifact }}
    defaults:
      run:
        working-directory: mori
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun test scripts/release.test.ts
      - run: python3 -I -m unittest discover -s scripts -p c_reference_cache_test.py
      - name: Select package targets and validate the version
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          PREWARM_ORACLE: ${{ inputs.prewarm_oracle }}
          DAILY_CHECK: ${{ inputs.daily_check }}
        run: |
          set -euo pipefail
          plan="$(bun scripts/release.ts plan "$EVENT_NAME" "$REF" "$GITHUB_REPOSITORY" "$DRY_RUN" "$PREWARM_ORACLE" "$DAILY_CHECK")"
          sha="$(git rev-parse HEAD)"
          {
            jq -r 'to_entries[] | "\(.key)=\(.value | if type == "string" then . else tojson end)"' <<< "$plan"
            echo "source_sha=$sha"
            jq -r --arg sha "$sha" '"artifact=mori\(if .mode == "preview" then "-preview" else "" end)-\(.version)-\($sha)"' <<< "$plan"
          } >> "$GITHUB_OUTPUT"
          jq -r '"Mori \(.version), mode \(.mode), publish \(.publish)"' <<< "$plan" >> "$GITHUB_STEP_SUMMARY"

  platform:
    name: ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    uses: ./.github/workflows/mori-package-target.yml
    with:
      platform: ${{ toJSON(matrix) }}
      source_sha: ${{ needs.validate.outputs.source_sha }}
      version: ${{ needs.validate.outputs.version }}
      mode: ${{ needs.validate.outputs.mode }}

  prepare:
    name: Prepare package bundle
    needs: [validate, platform]
    if: needs.validate.outputs.mode != 'prewarm'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mori
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mori-build-*
          path: release-assets
          merge-multiple: true
      - name: Write checksums and metadata
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          MODE: ${{ needs.validate.outputs.mode }}
        run: |
          set -euo pipefail
          command=prepare
          if [[ "$MODE" == preview ]]; then
            command=prepare-preview
          fi
          bun scripts/release.ts "$command" "$VERSION" ../release-assets \
            --tag "$TAG" --commit "$SOURCE_SHA"
          cat ../release-assets/checksums.txt
          cat ../release-assets/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ needs.validate.outputs.mode == 'daily' && 7 || 0 }}

  publish:
    needs: [validate, prepare]
    if: needs.validate.outputs.mode == 'tag' && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: mori
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: release-assets
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/checksums.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: bun scripts/release.ts publish "$TAG" ../release-assets --repo "$REPO"

  report-daily-failures:
    name: Report daily package failures
    needs: [validate, platform, prepare]
    if: >-
      !cancelled() && failure() && github.event_name == 'schedule' &&
      github.repository == 'Unique-Divine/jiyuu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Group and report failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I mori/scripts/ci/report_daily_packages.py
      - name: Retain daily failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mori-daily-failures-${{ github.run_attempt }}
          path: daily-package-failures.json
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true
