name: "⚡Tests"

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["main", "release/*"]

# Allow concurrent runs on main/release branches but isolates other branches
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: ${{ ! (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}

jobs:
  # Reserved workspace-level hook for checks that eventually span multiple tools.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install bun" # For running things and TS package management"
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.22 # Values: latest, <sha>, 1.2.3, canary
        # Outputs:
        # - cache-hit    : Whether the executable was read from cache. Ex. "true"
        # - bun-version  : The output from running `bun-version`. Ex. "1.0.0"
        # - bun-revision : The output from running `bun-revision`.
      - run: |
          echo "Placeholder for later"

  # Runs Bun tests only when Markdown TOC sources or their workflow change.
  mdtoc-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Check for relevant changes"
        id: check_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            check_changes:
              - "mdtoc/**/*"

      - if: steps.check_changes.outputs.check_changes == 'true'
        name: "Install bun" # For running things and TS package management"
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.22 # Values: latest, <sha>, 1.2.3, canary
        # Outputs:
        # - cache-hit    : Whether the executable was read from cache. Ex. "true"
        # - bun-version  : The output from running `bun-version`. Ex. "1.0.0"
        # - bun-revision : The output from running `bun-revision`.

      - if: steps.check_changes.outputs.check_changes == 'true'
        run: |
          bun install
        working-directory: mdtoc

      - if: steps.check_changes.outputs.check_changes == 'true'
        run: |
          bun test
        working-directory: mdtoc

  # Exercises the tmux observer only when its Rust project or CI definition changes.
  tmux-agent-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Check for relevant changes"
        id: watcher_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            watcher:
              - "tmux-agent-watch/**/*"
              - ".github/workflows/test.yaml"

      - if: steps.watcher_changes.outputs.watcher == 'true'
        name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - if: steps.watcher_changes.outputs.watcher == 'true'
        name: "Install just"
        uses: extractions/setup-just@v3

      - if: steps.watcher_changes.outputs.watcher == 'true'
        name: "Install tmux"
        run: sudo apt-get install --yes --no-install-recommends tmux

      - if: steps.watcher_changes.outputs.watcher == 'true'
        name: "Lint"
        run: just lint
        working-directory: tmux-agent-watch

      - if: steps.watcher_changes.outputs.watcher == 'true'
        name: "Test"
        run: just test
        working-directory: tmux-agent-watch

  # Verifies the standalone review-ledger CLI only when its implementation changes.
  gh-rev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Check for relevant changes"
        id: gh_rev_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gh_rev:
              - "gh-rev/**/*"
              - ".github/workflows/test.yaml"

      - if: steps.gh_rev_changes.outputs.gh_rev == 'true'
        name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - if: steps.gh_rev_changes.outputs.gh_rev == 'true'
        name: "Install just"
        uses: extractions/setup-just@v3

      - if: steps.gh_rev_changes.outputs.gh_rev == 'true'
        name: "Check"
        run: just check
        working-directory: gh-rev
