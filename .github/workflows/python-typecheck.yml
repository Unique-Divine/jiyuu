name: Python Types

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  typecheck:
    name: Python types / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Telegram MCP
            path: mcp/telegram
            artifact: telegram-mcp
            report_recipe: typecheck-report
          - name: tg-sai Python
            path: ts-pkg/tg-sai
            artifact: tg-sai-python
            report_recipe: py-typecheck-report
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check project paths
        id: changes
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        with:
          filters: |
            python:
              - '${{ matrix.path }}/**'
              - 'scripts/python/**'
              - 'justfile'
              - '.github/workflows/python-typecheck.yml'
      - name: Unaffected project
        if: github.event_name != 'workflow_dispatch' && steps.changes.outputs.python != 'true'
        run: echo "No relevant Python project changes; check completed successfully."
      - name: Set up uv and managed Python
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.python == 'true'
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.13'
      - name: Set up Just
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.python == 'true'
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Install locked project environment
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.python == 'true'
        working-directory: ${{ matrix.path }}
        run: uv sync --frozen --group dev
      - name: Verify report-only runner and file discovery
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.python == 'true'
        working-directory: ${{ matrix.path }}
        run: uv run --frozen --no-sync python -m unittest discover -s "$GITHUB_WORKSPACE/scripts/python" -p 'test_*.py' -v
      - name: Report type diagnostics
        id: report
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.python == 'true'
        working-directory: ${{ matrix.path }}
        env:
          REPORT_RECIPE: ${{ matrix.report_recipe }}
          REPORT_NAME: ${{ matrix.artifact }}
        run: just "$REPORT_RECIPE" "$RUNNER_TEMP/python-types/$REPORT_NAME"
      - name: Upload native diagnostics and report
        if: always() && steps.report.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-types-${{ matrix.artifact }}
          path: ${{ runner.temp }}/python-types/${{ matrix.artifact }}
          if-no-files-found: error
