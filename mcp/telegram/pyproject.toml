# Modified by Unique Divine in 2026: Jiyuu source installation and PyPI metadata.
[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniquedivine-telegram-mcp"
version = "2.0.2"
description = "Telegram MCP server maintained in Jiyuu. Reads and manages chats, messages, contacts, folders, and media through your Telegram user account."
readme = "README.md"
authors = [
    {name = "chigwell"},
    {name = "l1v0n1"}
]
maintainers = [{name = "Unique Divine"}]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9,<1",
    "httpx>=0.28.1,<1",
    "mcp[cli]>=1.8.0,<2",
    "nest-asyncio>=1.6.0,<2",
    "packaging>=25.0,<26",
    "python-dotenv>=1.1.0,<2",
    "python-json-logger>=3.3.0,<5",
    "qrcode>=8.2,<9",
    "telethon>=1.42.0,<2",
]

[project.optional-dependencies]
# Required only when TELEGRAM_PROXY_TYPE is set to socks5/socks4/http.
proxy = [
    "python-socks>=2.4.3",
]

[project.urls]
"Homepage" = "https://github.com/Unique-Divine/jiyuu/tree/main/mcp/telegram"
"Repository" = "https://github.com/Unique-Divine/jiyuu"
"Bug Tracker" = "https://github.com/Unique-Divine/jiyuu/issues"
"Upstream" = "https://github.com/chigwell/telegram-mcp"

[tool.setuptools]
py-modules = ["main", "sanitize", "session_string_generator"]
packages = ["telegram_mcp", "telegram_mcp.tools"]

[project.scripts]
telegram-mcp = "main:main"
uniquedivine-telegram-mcp = "main:main"
telegram-mcp-generate-session = "session_string_generator:main"

[tool.jiyuu.upstream]
repository = "chigwell/telegram-mcp"
package = "telegram-mcp"
version = "2.0.1"
commit = "0d7b7e3630397ff931624fee7e4b0f33a134c513"

# Read by mcp/scripts/site-manifest.ts. Set `site = false` under
# [tool.jiyuu] to leave this server off the site.
[tool.jiyuu.site]
tools = "telegram_mcp.catalog:list_tools"
env = [
    { name = "TELEGRAM_API_ID", required = true, secret = true },
    { name = "TELEGRAM_API_HASH", required = true, secret = true },
    { name = "TELEGRAM_SESSION_STRING", required = true, secret = true },
    { name = "TELEGRAM_EXPOSED_TOOLS", required = false, secret = false },
    { name = "JIYUU_MCP_NO_UPDATE_CHECK", required = false, secret = false },
]

# Synthetic values that let telegram_mcp.runtime import; no Telegram login.
[tool.jiyuu.site.tools-env]
TELEGRAM_API_ID = "12345"
TELEGRAM_API_HASH = "dummy_hash"
TELEGRAM_SESSION_NAME = "site_manifest"

[tool.black]
line-length = 99
target-version = ['py311']

[tool.flake8]
ignore = ["E203", "E501", "W503"]
max-line-length = 99
max-complexity = 10
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "docs/source/conf.py",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "flake8>=7.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ty==0.0.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.ty.environment]
# Keep the declared Python 3.10 minimum even when uv runs Python 3.13.
python-version = "3.10"
root = [".", "../../scripts/python"]

[tool.coverage.run]
branch = true
# Unit coverage focuses on deterministic local logic. The Telegram tool modules
# are live API adapters and should get separate mocked or integration coverage.
source = [
    "main",
    "sanitize",
    "telegram_mcp.runtime",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
