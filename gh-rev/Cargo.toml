[package]
name = "gh-rev"
version = "0.1.0"
authors = ["Unique Divine <realuniquedivine@gmail.com>"]
edition = "2024"
description = "Persistent local review ledger for GitHub branches and pull requests"
repository = "https://github.com/Unique-Divine/jiyuu"
homepage = "https://github.com/Unique-Divine/jiyuu"
documentation = "https://github.com/Unique-Divine/jiyuu/tree/main/gh-rev"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
fs2 = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9.8"

[workspace]
