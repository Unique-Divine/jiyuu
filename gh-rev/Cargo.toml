[package]
name = "gh-rev"
version = "0.1.0"
edition = "2024"
description = "Persistent local review ledger for GitHub branches and pull requests"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
fs2 = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9.8"

