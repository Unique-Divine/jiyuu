[package]
name = "jiyuu-abi"
version = "0.1.0"
authors = ["Unique Divine <ud@uniquedivine.com>"]
edition = "2024"
description = "Read, validate, and inspect EVM JSON ABIs and compiler artifacts"
repository = "https://github.com/Unique-Divine/jiyuu"
homepage = "https://github.com/Unique-Divine/jiyuu/tree/main/jiyuu-abi"
readme = "README.md"
license = "MIT"
keywords = ["ethereum", "evm", "abi", "solidity"]
categories = ["encoding", "development-tools"]

[dependencies]
alloy-json-abi = { version = "1.7", features = ["serde_json"] }
alloy-primitives = "1.7"
anyhow = "1"
serde_json = "1"

[dev-dependencies]
alloy-sol-types = "1.7"
tempfile = "3"
