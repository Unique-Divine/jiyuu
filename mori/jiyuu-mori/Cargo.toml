[package]
name = "jiyuu-mori"
version = "0.14.0-dev"
authors = ["Unique Divine <ud@uniquedivine.com>"]
edition = "2024"
rust-version = "1.89"
description = "Mori: cross-repo code graph for agents (Rust over the C program)"
repository = "https://github.com/Unique-Divine/jiyuu"
homepage = "https://github.com/Unique-Divine/jiyuu/tree/main/mori"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "mori"
path = "src/main.rs"

[features]
# Link the whole C program (mori/Makefile.cbm target libmori-c). Off by
# default so `cargo test --workspace` and the pure-Rust CI job build without
# the C toolchain or the 1.3 GB grammar tree. Without it, `mori` only reports
# that it was built without the C backend.
c-backend = ["dep:rusqlite", "dep:serde_json", "dep:sha2"]

[dependencies]
# The whole-archive link of libmori-c supplies every SQLite symbol before the
# linker considers rusqlite's bundled archive. Keep the bundled feature so
# other workspace binaries can link SQLite when Cargo unifies features.
rusqlite = { version = "0.41", default-features = false, features = ["bundled"], optional = true }
serde_json = { version = "1.0.151", optional = true }
sha2 = { version = "0.10", optional = true }

[build-dependencies]
serde_json = "1.0.151"

[dev-dependencies]
serde_json = "1.0.151"
