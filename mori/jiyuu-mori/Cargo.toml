[package]
name = "jiyuu-mori"
version = "0.14.0-dev"
authors = ["Unique Divine <ud@uniquedivine.com>"]
edition = "2024"
rust-version = "1.89"
description = "Mori: cross-repo code graph for agents (Rust over the C program)"
repository = "https://github.com/Unique-Divine/jiyuu"
homepage = "https://github.com/Unique-Divine/jiyuu/tree/main/mori"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "mori"
path = "src/main.rs"

[features]
# Link the whole C program (mori/Makefile.cbm target libmori-c). Off by
# default so `cargo test --workspace` and the pure-Rust CI job build without
# the C toolchain or the 1.3 GB grammar tree. Without it, `mori` only reports
# that it was built without the C backend.
c-backend = ["dep:rusqlite", "dep:serde", "dep:serde_json", "dep:sha2"]

[dependencies]
# This uses SQLite from libmori-c. `in_gecko` supplies bindings without
# adding another SQLite build or a system-library link.
rusqlite = { version = "0.41", default-features = false, features = ["in_gecko"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
sha2 = { version = "0.10", optional = true }

[build-dependencies]
serde_json = "1.0.151"
